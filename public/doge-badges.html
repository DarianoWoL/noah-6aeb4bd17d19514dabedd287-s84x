<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sir Doge Badges - War of Lords</title>
<style>
  /* Demo page only - not part of the badges */
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: 'Fredoka', 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
    color: #4a2c00;
    background: #fff8e1;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    box-sizing: border-box;
  }
  .demo-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; }

  /* ===================== BADGE STYLES (copy with the badges) ===================== */
  #badge-tournament, #badge-rules, #badge-fame {
    width: 120px;
    height: 120px;
    line-height: 0;
  }
  #badge-tournament svg, #badge-rules svg, #badge-fame svg {
    display: block;
    width: 120px;
    height: 120px;
    overflow: visible;
  }
  .sd-badge-fig {
    animation: sd-badge-bounce 2.4s ease-in-out infinite;
  }
  #badge-rules .sd-badge-fig { animation-delay: -0.8s; }
  #badge-fame .sd-badge-fig { animation-delay: -1.6s; }
  @keyframes sd-badge-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sd-badge-fig { animation: none !important; }
  }
</style>
